<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Capa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1400px; height: 1400px; }
  body {
    background: #0b1520;
    color: #f2efe9;
    font-family: "Bitstream Charter", "Liberation Serif", Georgia, serif;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; inset: -30%;
    background: radial-gradient(closest-side at 30% 22%, rgba(214,90,58,.34), transparent 70%),
                radial-gradient(closest-side at 82% 88%, rgba(38,86,120,.45), transparent 72%);
  }
  .no {
    position: absolute; right: -100px; bottom: -300px;
    font-family: "Liberation Sans", "DejaVu Sans", sans-serif;
    font-weight: 700; font-size: 760px; letter-spacing: -.05em;
    color: transparent; -webkit-text-stroke: 5px rgba(242,239,233,.10);
    line-height: .8;
  }
  .frame { position: absolute; inset: 92px; border: 2px solid rgba(242,239,233,.16); }
  .content { position: absolute; inset: 92px; padding: 96px 90px; display: flex; flex-direction: column; }
  .kicker {
    font-family: "Liberation Sans", sans-serif; font-size: 34px; font-weight: 700;
    letter-spacing: .42em; text-transform: uppercase; color: #d6905a;
  }
  .rule { width: 130px; height: 5px; background: #d65a3a; margin: 46px 0 56px; }
  h1 { font-size: 148px; line-height: .96; letter-spacing: -.022em; font-weight: 700; }
  h1 em { font-style: normal; color: #7fb4d8; }
  .sub {
    margin-top: 46px; font-size: 50px; line-height: 1.34; color: rgba(242,239,233,.74);
    max-width: 15ch;
  }
  .foot {
    margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between;
    font-family: "Liberation Sans", sans-serif;
  }
  .foot .eps { font-size: 40px; font-weight: 700; letter-spacing: .05em; }
  .foot .meta { font-size: 30px; color: rgba(242,239,233,.55); text-align: right; line-height: 1.5; }
  .bars { display: flex; align-items: flex-end; gap: 11px; height: 74px; margin-bottom: 18px; }
  .bars i { width: 11px; background: #d65a3a; border-radius: 6px; display: block; }
</style>
<div class="glow"></div>
<div class="no">NÃO</div>
<div class="frame"></div>
<div class="content">
  <div class="kicker">Curso em áudio</div>
  <div class="rule"></div>
  <h1>ING&nbsp;Direct<br><em>o banco que<br>disse não</em></h1>
  <div class="sub">A aritmética por trás do caso ING Bank of Canada.</div>
  <div class="foot">
    <div>
      <div class="bars">
        <i style="height:26px"></i><i style="height:58px"></i><i style="height:36px"></i>
        <i style="height:74px"></i><i style="height:48px"></i><i style="height:22px"></i>
        <i style="height:62px"></i><i style="height:32px"></i>
      </div>
      <div class="eps">6 EPISÓDIOS</div>
    </div>
    <div class="meta">Toronto, 1997<br>Dilema · Estratégia · Números</div>
  </div>
</div>
</html>
